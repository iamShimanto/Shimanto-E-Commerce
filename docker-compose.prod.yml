services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: prod
    container_name: server
    ports:
      - "127.0.0.1:5001:5000"
    env_file:
      - ./server/.env.production
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: prod
    container_name: admin
    ports:
      - "127.0.0.1:8081:80"
    env_file:
      - ./admin/.env.production
    depends_on:
      - backend
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: prod
    container_name: client
    ports:
      - "127.0.0.1:8080:80"
    env_file:
      - ./client/.env.production
    depends_on:
      - backend
    restart: unless-stopped

  next-client:
    build:
      context: ./next-client
      dockerfile: Dockerfile
      target: prod
    container_name: next-client
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - ./next-client/.env.production
    depends_on:
      - backend
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
