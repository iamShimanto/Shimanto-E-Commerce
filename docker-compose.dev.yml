services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: dev
    container_name: server-dev
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "800"
    depends_on:
      - redis
    volumes:
      - ./server:/app
      - /app/node_modules
    command: pnpm dev

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: dev
    container_name: admin-dev
    ports:
      - "5173:5173"
    env_file:
      - ./admin/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: