services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
      target: dev
    container_name: server-dev
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "800"
    depends_on:
      - redis
    volumes:
      - ./server:/app
      - /app/node_modules
    command: pnpm dev
    restart: unless-stopped

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
      target: dev
    container_name: admin-dev
    ports:
      - "5173:5173"
    env_file:
      - ./admin/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "800"
    volumes:
      - ./admin:/app
      - /app/node_modules
    depends_on:
      - backend
    command: pnpm dev --host 0.0.0.0 --port 5173
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: dev
    container_name: client-dev
    ports:
      - "5174:5174"
    env_file:
      - ./client/.env
    environment:
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "800"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend
    command: pnpm dev --host 0.0.0.0 --port 5174
    restart: unless-stopped

  next-client:
    build:
      context: ./next-client
      dockerfile: Dockerfile
      target: dev
    container_name: next-client-dev
    ports:
      - "3001:3001"
    env_file:
      - ./next-client/.env.local
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "800"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./next-client:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    command: pnpm dev --hostname 0.0.0.0 --port 3001 --webpack
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-dev
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
